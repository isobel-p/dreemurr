[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dreemurr"
version = "0.1.0"
description = "CLI tool for batch renaming image files with AI."
authors = [{name="Isobel Pang", email="173300585+isobel-p@users.noreply.github.com"}]
readme = "README.md"
license = {text = "GPL-3.0-only"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "click",
    "Pillow",
    "openrouter",
    "python-dotenv",
    "yaspin",
    "tqdm",
]
requires-python = ">=3.8"

[project.scripts]
dreemurr = "dreemurr.cli:cli"

[tool.setuptools.packages.find]
where = ["."]